
name: Build and Push StudyHub Images

on:
  push:
    branches:
      - feature/docker-setup
  workflow_dispatch:

jobs:
  # JOB 1: Quality gate
  test-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run backend tests
        env:
          DATABASE_URL: sqlite:///./test_studyhub.db
        run: python -m pytest -v

  # JOB 2: Build, push and deploy
  build-and-push:
    needs: test-backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            nimeshaka/studyhub-backend:latest
            nimeshaka/studyhub-backend:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./Frontend
          push: true
          tags: |
            nimeshaka/studyhub-frontend:latest
            nimeshaka/studyhub-frontend:${{ github.sha }}

      - name: Deploy backend to Render
        env:
          DEPLOY_URL: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
        run: curl --fail --silent --show-error "$DEPLOY_URL"

      - name: Wait for backend health check
        run: |
          for i in {1..12}; do
            if curl --fail --silent --show-error \
              https://studyhub-backend-8u98.onrender.com/health; then
              echo "Backend is healthy!"
              exit 0
            fi

            echo "Backend not ready yet. Retrying in 10 seconds..."
            sleep 10
          done

          echo "Backend health check failed!"
          exit 1
      
      - name: Deploy frontend to Render
        env:
          DEPLOY_URL: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
        run: curl --fail --silent --show-error "$DEPLOY_URL"
