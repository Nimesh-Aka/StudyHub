
name: Build and Push StudyHub Images

on:
  push:
    branches:
      - feature/docker-setup
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: nimeshaka/studyhub-backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./Frontend
          push: true
          tags: nimeshaka/studyhub-frontend:latest
    
      - name: Deploy backend to Render
        if: github.ref == 'refs/heads/feature/docker-setup'
        env:
          DEPLOY_URL: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
        run: curl --fail --silent --show-error "$DEPLOY_URL"

      - name: Deploy frontend to Render
        if: github.ref == 'refs/heads/feature/docker-setup'
        env:
          DEPLOY_URL: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
        run: curl --fail --silent --show-error "$DEPLOY_URL"


